<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NextEra — Video Speed Control</title>

  <link
    rel="stylesheet"
    href="popup.css"
  >
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">

      <div class="brand">

        <div class="brand-icon">
          <span class="speed-line line-1"></span>
          <span class="speed-line line-2"></span>
          <span class="speed-line line-3"></span>

          <div class="play-icon"></div>
        </div>

        <div class="brand-text">

          <h1>
            Next<span>Era</span>
          </h1>

          <p>Video Speed Control</p>

        </div>

      </div>

      <label class="switch">

        <input
          type="checkbox"
          id="enabled"
          checked
        >

        <span class="switch-slider"></span>

      </label>

    </header>


    <!-- STATUS CARD -->
    <section class="status-card">

      <div class="status-icon">
        ⚡
      </div>

      <div class="status-copy">

        <strong>
          Watching Faster
        </strong>

        <span>
          for a Smarter You
        </span>

      </div>

      <div class="status-state">

        <span id="statusText">
          Enabled
        </span>

        <span class="status-dot"></span>

      </div>

    </section>


    <!-- SPEED DISPLAY -->
    <section class="speed-display">

      <div class="speed-ring">

        <div class="speed-value">
          <span id="currentSpeedValue">
            1x
          </span>

          <small>
            Playback Speed
          </small>
        </div>

      </div>

      <div class="mode-row">

        <div
          class="mode-badge"
          id="turboBadge"
        >
          <span>⚡</span>
          Turbo Mode
        </div>

        <div
          class="audio-badge"
          id="audioBadge"
        >
          <span>🔇</span>
          Audio Muted
        </div>

      </div>

    </section>


    <!-- FINE CONTROL -->
    <section class="fine-controls">

      <button
        id="decreaseBtn"
        class="control-btn"
      >
        <span>−</span>
        0.5x
      </button>

      <button
        id="resetBtn"
        class="control-btn"
      >
        Reset
        <span>1x</span>
      </button>

      <button
        id="increaseBtn"
        class="control-btn"
      >
        <span>+</span>
        0.5x
      </button>

    </section>


    <!-- SPEED PRESETS -->
    <section class="speed-section">

      <div class="section-label">
        SPEED PRESETS
      </div>

      <div class="speed-grid">

        <button data-speed="1">
          1x
        </button>

        <button data-speed="2">
          2x
        </button>

        <button data-speed="3">
          3x
        </button>

        <button data-speed="4">
          4x
        </button>

        <button data-speed="5">
          5x
        </button>

        <button data-speed="10">
          10x
        </button>

        <button data-speed="15">
          15x
        </button>

        <button data-speed="20">
          20x
        </button>

        <button
          data-speed="30"
          class="turbo-btn"
        >
          <span>⚡</span>
          30x MAX
        </button>

      </div>

    </section>


    <!-- SKIP -->
    <button
      id="skipBtn"
      class="skip-btn"
    >

      <div class="skip-icon">
        ▶▶
      </div>

      <div class="skip-content">

        <strong>
          Skip to End
        </strong>

        <span>
          Jump to the end of the video
        </span>

      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- SHORTCUTS -->
    <section class="shortcuts">

      <div class="shortcut-title">

        <span class="keyboard-icon">
          ⌨
        </span>

        Keyboard Shortcuts

      </div>

      <div class="shortcut-list">

        <div>
          <kbd>Alt</kbd>
          <span>+</span>
          <kbd>↑</kbd>

          <label>
            +0.5x
          </label>
        </div>

        <div>
          <kbd>Alt</kbd>
          <span>+</span>
          <kbd>↓</kbd>

          <label>
            −0.5x
          </label>
        </div>

        <div>
          <kbd>Alt</kbd>
          <span>+</span>
          <kbd>R</kbd>

          <label>
            Reset 1x
          </label>
        </div>

      </div>

    </section>


    <!-- STATUS MESSAGE -->
    <div
      id="status"
      class="status-message"
    ></div>


    <!-- FOOTER -->
  <footer class="footer">

    <div class="footer-left">

      <div class="footer-brand">
        Next<span>Era</span>
        <small>v1.0.0</small>
      </div>

      <div class="creator">
        Created by
        <a
          href="https://github.com/Shailey07"
          target="_blank"
          id="githubProfile"
        >
          Shailendra Meghwal
        </a>
      </div>

    </div>

    <div class="footer-links">

      <a
        href="https://github.com/Shailey07"
        target="_blank"
        class="github-link"
        title="GitHub Profile"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.55v-2.13c-3.2.7-3.87-1.54-3.87-1.54-.53-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.33.96.1-.74.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.18a10.94 10.94 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.58.23 2.75.11 3.04.73.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.41-5.25 5.69.41.35.78 1.04.78 2.1v3.11c0 .3.21.66.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
          />
        </svg>
      </a>

      <a
        href="https://github.com/Shailey07/NEXT-ERA"
        target="_blank"
        class="repo-link"
        id="repoLink"
      >
        Repo
      </a>

    </div>

</footer>

  </div>


  <script src="popup.js"></script>

</body>

</html>
